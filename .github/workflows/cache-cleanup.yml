# =============================================================================
#  tree-sitter-mssql · GitHub Actions
# -----------------------------------------------------------------------------
#  File                cache-cleanup.yml
#  Workflow name       Cleanup stale caches
#  Type                Entrypoint
#  Triggers            schedule (daily, 06:00 UTC)
#                      workflow_dispatch
#  Purpose             Reclaims the Actions-cache budget by deleting caches
#                      scoped to a closed PR or a deleted branch — verify.yml
#                      caches the cargo registry and build artifacts via
#                      Swatinem/rust-cache.
# =============================================================================

name: Cleanup stale caches

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List stale caches without deleting them'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete stale caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete caches for closed PRs and deleted branches
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          set -euo pipefail

          gh cache list --limit 200 --json id,ref,key,sizeInBytes \
            --jq '.[] | [.id, .ref, .key, .sizeInBytes] | @tsv' > caches.tsv

          while IFS=$'\t' read -r id ref key size; do
            [ -z "$id" ] && continue
            stale=false

            case "$ref" in
              refs/pull/*/merge)
                pr_number=$(echo "$ref" | sed -E 's#refs/pull/([0-9]+)/merge#\1#')
                state=$(gh pr view "$pr_number" --json state --jq '.state' 2>/dev/null || echo "MISSING")
                [ "$state" != "OPEN" ] && stale=true
                ;;
              refs/heads/*)
                branch="${ref#refs/heads/}"
                branch_path=$(jq -nr --arg branch "$branch" '$branch | @uri')
                if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_path}" >/dev/null 2>&1; then
                  stale=true
                fi
                ;;
            esac

            if [ "$stale" = "true" ]; then
              echo "Stale: $key ($ref, $size bytes)"
              if [ "$DRY_RUN" != "true" ]; then
                gh cache delete "$id"
              fi
            fi
          done < caches.tsv
