# =============================================================================
#  tree-sitter-mssql · GitHub Actions
# -----------------------------------------------------------------------------
#  File                gala-release.yml
#  Workflow name       Gala release
#  Type                Entrypoint (runs in this repo only)
#  Triggers            push (main branch)
#                      workflow_dispatch
#  Purpose             Cuts the release when a promotion lands on main. gala
#                      (configured in .gala.toml) reads the Conventional
#                      Commits since the last v* tag, bumps the version in
#                      Cargo.toml, package.json, and tree-sitter.json,
#                      refreshes package-lock.json, regenerates the parser
#                      (which embeds the tree-sitter.json version), writes the
#                      CHANGELOG.md entry, commits it, tags it, pushes the
#                      commit and tag atomically, and fast-forwards dev to the
#                      release commit. It does not publish or create the GitHub
#                      Release: this workflow then dispatches release.yml with
#                      the new tag, on the tag ref so the publish run keeps its
#                      npm provenance, and that workflow publishes crates.io,
#                      npm and GitHub Packages and creates the GitHub Release.
#
#                      The pushes go over the RELEASE_DEPLOY_KEY deploy key,
#                      not GITHUB_TOKEN: the rulesets require a pull request
#                      for main and dev and restrict creating v* tags, and the
#                      deploy key is the ruleset bypass actor for those
#                      pushes. The release commit body carries gala's skip-ci
#                      marker, which keeps it from re-running this workflow
#                      and may also suppress release.yml's tag-push trigger,
#                      so release.yml is dispatched explicitly instead of
#                      relying on that event. A promotion that releases
#                      nothing reports released=false and dispatches nothing.
# =============================================================================

name: Gala release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gala-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GALA_VERSION: '0.3.1'

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Job-level elevation: dispatching release.yml needs actions: write. The
    # git pushes authenticate with the deploy key, not this token.
    permissions:
      contents: read
      actions: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (gala reads tags and history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # origin becomes an SSH remote authenticated by the deploy key, so
          # gala's atomic push and dev sync use the ruleset bypass.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Configure git identity
        # gala makes the release commit with the runner's git; without an
        # identity git refuses to commit at all.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install Rust toolchain
        # gala's cargo manager runs cargo to refresh the lockfile.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0
      - name: Set up Node.js
        # gala refreshes package-lock.json with npm, and its postBump hook
        # regenerates the parser with the tree-sitter-cli pinned here.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          # Resolves @alfpricot/gala from GitHub Packages; every other
          # package still comes from the public npm registry.
          registry-url: https://npm.pkg.github.com
          scope: '@alfpricot'
      - name: Install gala
        # The prebuilt gala binary from GitHub Packages; the token needs
        # packages: read, and each gala package grants this repository access.
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm install --global "@alfpricot/gala@${GALA_VERSION}"
      - name: Install the tree-sitter CLI
        # --ignore-scripts skips this package's own node-gyp-build install
        # script, which also skips the CLI's binary download; the rebuild
        # fetches it.
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
      - name: Release
        id: gala
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gala release
      - name: Dispatch the publish workflow for the new tag
        if: steps.gala.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gala.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG" -f "tag=${TAG}"
